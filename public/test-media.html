<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Media - G-Chat Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .test-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .test-card { padding: 30px; }
    .test-card h2 { margin-top: 0; }
    .preview-area { margin: 15px 0; }
    .preview-area img, .preview-area video { max-width: 100%; max-height: 300px; border-radius: 4px; }
    .result-area { background: var(--bg-subtle); border: 1px solid var(--border-light); border-radius: 4px; padding: 15px; white-space: pre-wrap; margin-top: 15px; display: none; }
    .loading { display: none; text-align: center; padding: 20px; }
    .loading.active { display: block; }
    .back-link { margin-bottom: 20px; display: block; }
    .media-attach-row { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="test-container">
    <a href="/" class="back-link text-muted">&larr; Volver al Dashboard</a>
    <div class="glass-panel test-card">
      <h2><i class="fa-solid fa-flask text-purple"></i> Prueba con imágenes y videos</h2>
      <p class="text-muted">Sube una foto o video, escribe una pregunta, o ambos. El bot analizará todo junto con los documentos del Drive.</p>

      <form id="test-form">
        <div class="input-group">
          <label for="question">Texto (opcional)</label>
          <textarea id="question" rows="3" placeholder="Escribe tu duda administrativa..." style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-inset);color:var(--text-main);font-family:var(--font-sans);"></textarea>
        </div>

        <div class="input-group" style="margin-top:15px;">
          <label for="file">Adjuntar foto, video o audio</label>
          <div class="media-attach-row">
            <button type="button" class="btn btn-camera-capture" id="btn-open-camera">
              <i class="fa-solid fa-camera"></i> Abrir cámara
            </button>
            <button type="button" class="btn" id="btn-open-audio">
              <i class="fa-solid fa-microphone"></i> Grabar audio
            </button>
          </div>
          <input type="file" id="file" accept="image/*,video/*,audio/*" style="width:100%;margin-top:10px;padding:10px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-subtle);color:var(--text-main);">
          <div class="preview-area" id="preview"></div>
        </div>

        <button type="submit" class="btn btn-gradient btn-block" style="margin-top:15px;">
          <i class="fa-solid fa-paper-plane"></i> Enviar para análisis
        </button>
      </form>

      <div class="loading" id="loading">
        <i class="fa-solid fa-spinner fa-spin fa-2x text-purple"></i>
        <p class="text-muted">Analizando archivo y consultando documentación...</p>
      </div>

      <div class="result-area" id="result"></div>
    </div>
  </div>

  <script src="camera.js"></script>
  <script>
    const password = localStorage.getItem('adminPassword');
    if (!password) { window.location.href = '/'; }

    const fileInput = document.getElementById('file');
    fileInput.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        const file = this.files[0];
        const preview = document.getElementById('preview');
        preview.innerHTML = '';
        const url = URL.createObjectURL(file);
        if (file.type.startsWith('video/')) {
          preview.innerHTML = `<video controls src="${url}"></video>`;
        } else if (file.type.startsWith('audio/')) {
          preview.innerHTML = `<audio controls src="${url}"></audio>`;
        } else {
          preview.innerHTML = `<img src="${url}" alt="Preview">`;
        }
      }
    });

    document.getElementById('test-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      const question = document.getElementById('question').value;
      const file = fileInput.files[0];

      if (!question && !file) { alert('Escribe una consulta o adjunta una imagen, video o audio.'); return; }

      if (question) formData.append('question', question);
      if (file) formData.append('file', file);

      document.getElementById('loading').classList.add('active');
      document.getElementById('result').style.display = 'none';

      try {
        const response = await fetch('/api/admin/test-media', {
          method: 'POST',
          headers: { 'x-admin-password': password },
          body: formData
        });

        document.getElementById('loading').classList.remove('active');

        if (response.ok) {
          const data = await response.json();
          const resultDiv = document.getElementById('result');
          resultDiv.textContent = data.answer;
          resultDiv.style.display = 'block';
        } else {
          const err = await response.json();
          alert('Error: ' + (err.error || 'Error desconocido'));
        }
      } catch (err) {
        document.getElementById('loading').classList.remove('active');
        alert('Error de conexión: ' + err.message);
      }
    });

    // Hand a captured photo/video/audio to the regular file input so the
    // existing submit handler works unchanged.
    function showPreview(file) {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';
      const url = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        preview.innerHTML = `<video controls src="${url}"></video>`;
      } else if (file.type.startsWith('audio/')) {
        preview.innerHTML = `<audio controls src="${url}"></audio>`;
      } else {
        preview.innerHTML = `<img src="${url}" alt="Preview">`;
      }
    }

    function injectCapturedFile(file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      showPreview(file);
    }

    if (window.MediaCapture) {
      document.getElementById('btn-open-camera').addEventListener('click', () => {
        window.MediaCapture.open({
          mode: 'photo',
          questionId: 'question',
          onSubmit: injectCapturedFile
        });
      });
      document.getElementById('btn-open-audio').addEventListener('click', () => {
        window.MediaCapture.open({
          mode: 'audio',
          questionId: 'question',
          onSubmit: injectCapturedFile
        });
      });
    }
  </script>
</body>
</html>
